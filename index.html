    const history=state.attempts[p.id]||[],latest=history.at(-1);

        <div class="math-statement">${escape(p.statement[ls])}</div>${contextContest?`<div class="contest-context-note">${ic('trophy','tiny')} ${escape(contextContest.name)} · ${escape(txt('compLocalNote'))} <button class="text-link" data-contest="${escape(contextContest.id)}">${escape(txt('compBack'))}</button></div>`:''}
        ${accordion('lamp',txt('hint'),`<ol>${p.hints[ls].map(h=>`<li>${escape(h)}</li>`).join('')}</ol>`)}
        ${accordion('warning',txt('commonMistakes'),`<ul>${p.mistakes[ls].map(m=>`<li>${escape(m)}</li>`).join('')}</ul>`)}

      </section>
      <div><section class="panel panel-pad input-panel" aria-label="${escape(txt('yourWork'))}"><div class="panel-heading"><h2>${escape(txt('yourWork'))}</h2><span class="tag violet">${escape(kindLabel(p.kind))}</span></div><label for="proof-input">${escape(txt('inputHelp'))}</label><p class="input-help">${escape(txt('feedbackNotice'))}</p><textarea id="proof-input" maxlength="5000" placeholder="${escape(txt('inputPlaceholder'))}">${escape(state.drafts[p.id]||'')}</textarea>

  function skillsPage(){return `<div class="app-page"><div class="body-padding"><div class="page-header"><div class="section-kicker">${escape(txt('sectionSkills'))}</div><h1 class="page-title">${escape(txt('skillTitle'))}</h1><p class="page-sub">${escape(txt('skillDesc'))}</p></div><div class="skills-grid">${[1,2,3,4].map((i)=>`<article class="skill-card"><span class="tag ${['violet','teal','amber','coral'][i-1]}">0${i}</span><h3 style="margin-top:16px">${escape(txt('skill'+i))}</h3><p>${escape(txt('skill'+i+'desc'))}</p></article>`).join('')}</div><div class="logic-demo" style="margin:30px 0"><div><h2 class="section-title">${escape(txt('logicTitle'))}</h2><p class="section-desc">${escape(txt('logicDesc'))}</p></div>${logicControl()}</div>${footer()}</div></div>`;}
  function topicsPage(){return `<div class="app-page"><div class="body-padding"><div class="page-header"><div class="section-kicker">${escape(txt('sectionTopics'))}</div><h1 class="page-title">${escape(txt('topicsTitle'))}</h1><p class="page-sub">${escape(txt('topicsDesc'))}</p></div><div class="section-kicker">${escape(txt('selectGrade'))}</div><div class="grade-row">${Object.keys(study).map(g=>`<button class="grade-button ${state.grade===g?'selected':''}" data-grade="${g}">${escape(txt(g==='college'?'college':'grade'+g.slice(1)))}</button>`).join('')}</div><section class="grade-panel"><div class="label-small">${escape(txt('gradeTopics'))}</div><h2 style="margin-top:12px">${escape(txt(state.grade==='college'?'college':'grade'+state.grade.slice(1)))}</h2><ul>${study[state.grade][state.lang].map(s=>`<li>${escape(s)}</li>`).join('')}</ul><button class="btn btn-primary" data-page="problems" style="margin-top:24px">${escape(txt('browse'))} ${ic('arrow')}</button></section>${footer()}</div></div>`;}
  function aboutPage(){return `<div class="app-page"><div class="body-padding"><div class="page-header"><div class="section-kicker">${escape(txt('sectionAbout'))}</div><h1 class="page-title">${escape(txt('aboutTitle'))}</h1><p class="page-sub">${escape(txt('aboutDesc'))}</p></div><div class="about-layout"><div class="panel about-panel" id="mission"><span class="label-small">${escape(txt('sectionMission'))}</span><h2 style="margin-top:15px">${escape(txt('mission'))}</h2><p>${escape(txt('missionText'))}</p><div class="mini-stat"><div class="stat-value serif">Think. Prove. Refine.</div><div class="tiny-caption" style="margin-top:8px">Olympiad Proof Clinic</div></div></div><div class="panel about-panel" id="team"><span class="label-small">${escape(txt('sectionTeam'))}</span><h2 style="margin-top:15px">${escape(txt('teamTitle'))}</h2><p>${escape(txt('teamText'))}</p></div><div class="panel about-panel"><span class="label-small">${escape(txt('sectionPrivacy'))}</span><h2 style="margin-top:15px">${escape(txt('privacy'))}</h2><p>${escape(txt('privacyText'))}</p></div><div class="panel about-panel"><span class="label-small">${escape(txt('sectionLimits'))}</span><h2 style="margin-top:15px">${escape(txt('faq'))}</h2><p>${escape(txt('faqText'))}</p></div></div>${footer()}</div></div>`;}
  function pageContent(){return ({home,problems:library,competitions:competitionHub,competition:competitionDetail,practice,skills:skillsPage,topics:topicsPage,about:aboutPage}[state.page]||home)();}
  function updateLogic(){
    const forms={original:['P','Q','logicCaptionOriginal'],converse:['Q','P','logicCaptionConverse'],contrapositive:['¬Q','¬P','logicCaptionContrapositive']};
    const [a,b,k]=forms[state.logic];const n1=document.getElementById('logic-from'),n2=document.getElementById('logic-to'),cap=document.getElementById('logic-caption');
    if(n1){n1.textContent=a;n2.textContent=b;cap.textContent=txt(k);}
  }
  function render(options={}){
    const existing=document.getElementById('main'),oldY=existing?.scrollTop||0;
    document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
    document.title=`Olympiad Proof Clinic · ${txt(state.page==='home'?'home':state.page)}`;
    $app.innerHTML=`<div class="shell">${sidebar()}<div class="mobile-overlay ${state.mobileMenu?'active':''}" data-menu="close"></div><main id="main" class="main ${state.page==='home'?'home-scroll':''}">${topbar()}${pageContent()}</main></div>`;
    updateLogic();
    if(options.keepScroll){document.getElementById('main').scrollTop=oldY;}
    else{document.getElementById('main').scrollTop=0;}
  }
  function navigate(page,opts={}){
    state.page=page;state.mobileMenu=false;
    if(opts.kind){state.contestContext=null;state.kind=opts.kind;const p=problems.find(x=>x.kind===opts.kind);if(p)state.problemId=p.id;}
    render();
  }
  function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=s;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
  function handleReview(){
    const field=document.getElementById('proof-input');if(!field)return;
    const text=field.value.trim();if(!text){toast(txt('emptyError'));field.focus();return;}
    if(text.length>MAX_CHARS){toast(txt('longError'));return;}
    const words=text.split(/\s+/).filter(Boolean).length;
    state.drafts[state.problemId]=field.value;
    (state.attempts[state.problemId]??=[]).push({short:words<25,length:text.length});
    render({keepScroll:true});
    document.querySelector('.feedback')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
    toast(txt('saved'));
  }
  $app.addEventListener('click',event=>{
    const el=event.target.closest('button');if(!el)return;
    if(el.dataset.lang){const old=state.lang;state.lang=el.dataset.lang;try{localStorage.setItem('opc_language',state.lang);}catch(_){}if(old!==state.lang)render({keepScroll:true});return;}
    if(el.dataset.page){navigate(el.dataset.page);return;}
    if(el.dataset.contest){state.contestId=el.dataset.contest;navigate('competition');return;}
    if(el.dataset.contestProblem){const p=problems.find(p=>p.id===el.dataset.contestProblem);if(!p)return;state.problemId=p.id;state.kind=p.kind;state.contestContext=el.dataset.fromContest||null;navigate('practice');return;}
    if(el.dataset.compCountry){state.compCountry=el.dataset.compCountry;render({keepScroll:true});return;}
    if(el.dataset.compReset){state.compCountry='all';state.compTopic='all';state.compFormat='all';state.compSearch='';render({keepScroll:true});return;}
    if(el.dataset.kind){navigate('practice',{kind:el.dataset.kind});return;}
    if(el.dataset.topic){state.topic=el.dataset.topic;state.kindFilter='all';state.diffFilter='all';state.search='';navigate('problems');return;}
    if(el.dataset.problem){const p=problems.find(p=>p.id===el.dataset.problem);if(!p)return;state.contestContext=null;state.problemId=p.id;state.kind=p.kind;navigate('practice');return;}
    if(el.dataset.grade){state.grade=el.dataset.grade;navigate('topics');return;}
    if(el.dataset.difficulty){state.diffFilter=el.dataset.difficulty;state.kindFilter='all';state.topic='all';state.search='';navigate('problems');return;}
    if(el.dataset.about){navigate('about');requestAnimationFrame(()=>document.getElementById(el.dataset.about)?.scrollIntoView({behavior:'smooth',block:'center'}));return;}
    if(el.dataset.menu){state.mobileMenu=el.dataset.menu==='toggle'?!state.mobileMenu:false;render({keepScroll:true});return;}
    if(el.dataset.scroll){document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return;}
    if(el.dataset.logic){state.logic=el.dataset.logic;document.querySelectorAll('[data-logic]').forEach(b=>{b.classList.toggle('active',b.dataset.logic===state.logic);b.setAttribute('aria-pressed',String(b.dataset.logic===state.logic));});updateLogic();return;}
    if(el.dataset.symbol){const field=document.getElementById('proof-input');if(!field)return;const start=field.selectionStart,end=field.selectionEnd;field.setRangeText(el.dataset.symbol,start,end,'end');state.drafts[state.problemId]=field.value;document.getElementById('char-count').textContent=field.value.length+' / '+MAX_CHARS;field.focus();return;}
    if(el.dataset.clear){const field=document.getElementById('proof-input');if(!field)return;field.value='';state.drafts[state.problemId]='';document.getElementById('char-count').textContent='0 / '+MAX_CHARS;field.focus();return;}
    if(el.dataset.review){handleReview();return;}
  });
  $app.addEventListener('input',event=>{
    if(event.target.id==='proof-input'){state.drafts[state.problemId]=event.target.value;const count=document.getElementById('char-count');if(count)count.textContent=event.target.value.length+' / '+MAX_CHARS;}
    if(event.target.id==='comp-search'){
      const pos=event.target.selectionStart;state.compSearch=event.target.value;render({keepScroll:true});const search=document.getElementById('comp-search');search?.focus();try{search?.setSelectionRange(pos,pos);}catch(_){}
    }
    if(event.target.id==='library-search'){
      const pos=event.target.selectionStart;state.search=event.target.value;render({keepScroll:true});const search=document.getElementById('library-search');search?.focus();try{search?.setSelectionRange(pos,pos);}catch(_){}
    }
  });
  $app.addEventListener('change',event=>{
    if(event.target.id==='comp-topic'){state.compTopic=event.target.value;render({keepScroll:true});}
    if(event.target.id==='comp-format'){state.compFormat=event.target.value;render({keepScroll:true});}
    if(event.target.id==='kind-filter'){state.kindFilter=event.target.value;render({keepScroll:true});}
    if(event.target.id==='topic-filter'){state.topic=event.target.value;render({keepScroll:true});}
    if(event.target.id==='diff-filter'){state.diffFilter=event.target.value;render({keepScroll:true});}
  });
  $app.addEventListener('pointermove',event=>{
    const canvas=event.target.closest('#math-canvas');if(!canvas||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const svg=canvas.querySelector('svg');if(!svg)return;const r=svg.getBoundingClientRect();const x=Math.max(0,Math.min(520,(event.clientX-r.left)*520/r.width)),y=Math.max(0,Math.min(390,(event.clientY-r.top)*390/r.height));
    const line=canvas.querySelector('#pointer-line'),dot=canvas.querySelector('#pointer-dot');if(line){line.setAttribute('x2',String(x));line.setAttribute('y2',String(y));line.setAttribute('opacity','.7');}if(dot){dot.setAttribute('cx',String(x));dot.setAttribute('cy',String(y));dot.setAttribute('opacity','.8');}
    const node=event.target.closest('[data-mathpoint]');const tip=document.getElementById('math-tip');if(node&&tip){tip.textContent=`${node.dataset.mathpoint}  ·  ${state.lang==='en'?'Explore a relation':'探索节点关系'}`;}
  });
  $app.addEventListener('pointerout',event=>{
    const canvas=event.target.closest('#math-canvas');if(!canvas)return;
    if(event.relatedTarget&&canvas.contains(event.relatedTarget))return;
    ['#pointer-line','#pointer-dot'].forEach(q=>canvas.querySelector(q)?.setAttribute('opacity','0'));
    const tip=canvas.querySelector('#math-tip');if(tip)tip.textContent=txt('mathTip');
  });
  $app.addEventListener('focusin',event=>{if(event.target.hasAttribute('data-mathpoint')){const tip=document.getElementById('math-tip');if(tip)tip.textContent=`${event.target.dataset.mathpoint}`;}});
  render();
})();

</script>
</body>
</html>
